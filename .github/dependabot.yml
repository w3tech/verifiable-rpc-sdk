version: 2
updates:
  # npm / pnpm workspace — single lockfile at root resolves all packages/*
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: "main"
    assignees:
      - "fasashen"
      - "memekas"
      - "askolesov"
      - "Balevka"
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "deps(npm)"
    # Group minor/patch updates into a single PR
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by CI and publish workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    target-branch: "main"
    assignees:
      - "fasashen"
      - "memekas"
      - "megatron757"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"
    # Group minor/patch updates into a single PR
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
